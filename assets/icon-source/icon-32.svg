<!-- 32px: strokes up another notch; faint outer ring dimmed (0.14 -> 0.10)
     so it reads as glow, not noise. -->
<svg viewBox="0 0 128 128" xmlns="http://www.w3.org/2000/svg">
  <rect x="4" y="4" width="120" height="120" rx="27" fill="#141414"/>
  <circle cx="64" cy="64" r="45" fill="none" stroke="#AFA9EC" stroke-width="2.8" opacity="0.10"/>
  <circle cx="64" cy="64" r="32" fill="none" stroke="#AFA9EC" stroke-width="4.2" opacity="0.35"/>
  <circle cx="64" cy="64" r="20" fill="none" stroke="#AFA9EC" stroke-width="5.5" opacity="0.8"/>
  <circle cx="64" cy="64" r="8.5" fill="#AFA9EC"/>
</svg>
